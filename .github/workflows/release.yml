name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # створити Release і прикріпити файли

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test — the wheel installs into a clean venv
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/findex --version
          /tmp/clean/bin/findex --help

      - name: Create GitHub Release with the wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "findex $GITHUB_REF_NAME" \
            --notes "findex $GITHUB_REF_NAME — див. README. Встановлення: uv tool install ./findex-*.whl"
