name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ruff · pyright · pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (exactly as in uv.lock)
        run: uv sync --locked --all-groups  # bench теж: pyright перевіряє і скрипт замірів

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Pyright (strict)
        run: uv run pyright

      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=term
