[project]
name = "findex"
version = "0.6.0"
description = "Навчальний пошуковик: асинхронний краулер, інвертований індекс, BM25, мова запитів і CLI"
readme = "README.md"
authors = [
    { name = "Danil Kovtun", email = "danilcreativniy@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["search", "inverted-index", "bm25", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
findex = "findex.cli:app"

[project.urls]
Repository = "https://github.com/danilk202/findex"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
]
dev = [
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: тест довший за секунду (пропустити: -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true
omit = [
    # одноразові скрипти вимірювань з лаб 1–2: запускаються вручну, результати в README
    "*/findex/bench.py",
    "*/findex/bench_io.py",
    "*/findex/membench.py",
    "*/findex/eager.py",
    "*/findex/stats.py",
    # лаба 5: драйвер замірів і демонстрації, запускаються вручну, результати в README
    "*/findex/parbench.py",
    "*/findex/race.py",
    "*/findex/iobench.py",
    # лаба 6: локальне дзеркало, драйвер замірів і демо затримки циклу
    "*/findex/mirror.py",
    "*/findex/crawlbench.py",
    "*/findex/looplag.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кирилиця й типографські лапки в рядках/коментарях — навмисно
]
