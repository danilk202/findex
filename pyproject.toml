[project]
name = "findex"
version = "1.0.0"
description = "Навчальний пошуковик: краулер, інвертований індекс на NumPy, BM25, семантичний і гібридний пошук, CLI і веб на FastAPI"
readme = "README.md"
authors = [
    { name = "Danil Kovtun", email = "danilcreativniy@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["search", "inverted-index", "bm25", "information-retrieval", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[project.urls]
Repository = "https://github.com/danilk202/findex"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --benchmark-disable"
markers = ["slow: тест довший за секунду (пропустити: -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true
omit = [
    # одноразові скрипти вимірювань з лаб 1–2: запускаються вручну, результати в README
    "*/findex/bench.py",
    "*/findex/bench_io.py",
    "*/findex/membench.py",
    "*/findex/eager.py",
    "*/findex/stats.py",
    # лаба 5: драйвер замірів і демонстрації, запускаються вручну, результати в README
    "*/findex/parbench.py",
    "*/findex/race.py",
    "*/findex/iobench.py",
    # лаба 6: локальне дзеркало, драйвер замірів і демо затримки циклу
    "*/findex/mirror.py",
    "*/findex/crawlbench.py",
    "*/findex/looplag.py",
    # лаба 7: драйвер замірів def/async і oha — запускається вручну, результати в README
    "*/findex/webbench.py",
    # лаба 8: драйвер замірів (до/після, скорер, сніпети) — запускається вручну
    "*/findex/profbench.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кирилиця й типографські лапки в рядках/коментарях — навмисно
]
