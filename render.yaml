# Render Blueprint: New → Blueprint → репозиторій danilk202/findex
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INDEX_PATH
        value: /app/index.bin
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
